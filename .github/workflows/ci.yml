name: CI

on:
  push:
    branches: [main, refactor/customer-react-vite]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven
      - name: Compile and package
        run: mvn -B -ntp -pl sky-server -am -DskipTests package
      - uses: actions/upload-artifact@v4
        with:
          name: sky-server-jar
          path: sky-server/target/sky-server-*.jar
          if-no-files-found: error

  admin-frontend:
    name: Merchant React build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sky-frontend-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sky-frontend-admin/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: merchant-web-dist
          path: sky-frontend-admin/dist
          if-no-files-found: error

  customer-frontend:
    name: Customer React build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sky-frontend-user
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sky-frontend-user/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: customer-web-dist
          path: sky-frontend-user/dist
          if-no-files-found: error

  docker:
    name: Docker image validation
    runs-on: ubuntu-latest
    needs: [backend, admin-frontend, customer-frontend]
    strategy:
      matrix:
        include:
          - image: backend
            context: .
            file: Dockerfile.backend
          - image: admin-web
            context: ./sky-frontend-admin
            file: ./sky-frontend-admin/Dockerfile
          - image: customer-web
            context: ./sky-frontend-user
            file: ./sky-frontend-user/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          tags: sky-take-out/${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

