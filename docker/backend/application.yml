server:
  # Platforms such as Render tell the application which port to listen on in PORT.
  port: ${PORT:8080}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  main:
    allow-circular-references: true
  datasource:
    druid:
      driver-class-name: com.mysql.cj.jdbc.Driver
      # DB_SSL_MODE: DISABLED inside docker compose; VERIFY_IDENTITY for a database reached over the
      # internet, such as TiDB Cloud, so the connection is encrypted and the server's certificate checked.
      url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:sky_take_out}?serverTimezone=UTC&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&sslMode=${DB_SSL_MODE:DISABLED}&allowPublicKeyRetrieval=true&allowMultiQueries=true
      username: ${DB_USERNAME:sky_app}
      password: ${DB_PASSWORD}
  redis:
    # A redis:// URL, such as the one Render gives a Key Value instance, replaces host, port and password.
    url: ${REDIS_URL:}
    host: ${REDIS_HOST:redis}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD}
    database: ${REDIS_DATABASE:10}

management:
  server:
    # A separate port that docker compose does not publish and nginx does not proxy.
    port: ${MANAGEMENT_PORT:9090}
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      # Shows the database and Redis checks. Safe only because this port is internal.
      show-details: always

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.sky.entity
  configuration:
    map-underscore-to-camel-case: true

logging:
  pattern:
    # Adds the request id (RequestIdFilter) after the level on every line.
    level: "%5p [%X{requestId:-}]"
  level:
    com.sky.mapper: info
    com.sky.service: info
    com.sky.controller: info

sky:
  jwt:
    admin-secret-key: ${SKY_JWT_ADMIN_SECRET}
    admin-ttl: 7200000
    admin-token-name: token
    user-secret-key: ${SKY_JWT_USER_SECRET}
    user-ttl: 7200000
    user-token-name: authentication
  alioss:
    endpoint: ${ALIOSS_ENDPOINT:}
    access-key-id: ${ALIOSS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIOSS_ACCESS_KEY_SECRET:}
    bucket-name: ${ALIOSS_BUCKET_NAME:}
  shop:
    address: ${SHOP_ADDRESS:Demo Restaurant}
  baidu:
    ak: ${BAIDU_MAP_AK:}
  payment:
    # Lets customers mark their own orders paid without Stripe. For demos only; never with real money.
    simulation-enabled: ${PAYMENT_SIMULATION_ENABLED:false}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    publishable-key: ${STRIPE_PUBLISHABLE_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    success-url: ${STRIPE_SUCCESS_URL:}
    cancel-url: ${STRIPE_CANCEL_URL:}
